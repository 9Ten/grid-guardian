<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Guardian — PEA EMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pea-purple: #5B2D8E;
            --pea-gold: #C8A014;
            --bg-main: #F8F9FA;
            --bg-panel: #FFFFFF;
            --border: #E0E0E0;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --color-grid: #5B2D8E;
            --color-diesel: #D4531A;
            --color-bess: #2E9E6B;
            --color-shed: #C0392B;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'IBM Plex Sans Thai', sans-serif;
            margin: 0; padding: 0;
        }
        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 16px;
            padding: 16px;
        }
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
        }

        /* Task 3: Operational Status Styles */
        .col-left h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--pea-purple);
            padding-bottom: 4px;
            font-size: 1rem;
            color: var(--pea-purple);
            font-weight: 600;
        }
        .source-meter {
            margin-bottom: 12px;
        }
        .source-meter label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .meter-bar {
            height: 12px;
            background: #EEEEEE;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .meter-bar .fill {
            height: 100%;
            transition: width 0.5s ease;
        }
        .source-meter .value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .soc-gauge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 32px;
            position: relative;
        }
        .soc-gauge {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.5rem;
            position: relative;
            background: conic-gradient(var(--color-bess) var(--soc-p), #EEEEEE 0);
            box-shadow: inset 0 0 0 12px var(--bg-panel);
        }
        .soc-gauge .limit-marker {
            position: absolute;
            width: 2px;
            height: 12px;
            background: var(--color-shed);
            z-index: 2;
        }
        .soc-gauge .limit-min {
            transform: rotate(72deg) translateY(-64px); /* 20% limit */
        }
        .soc-gauge .limit-max {
            transform: rotate(324deg) translateY(-64px); /* 90% limit */
        }
        .soc-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .limit-labels {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--color-shed);
            margin-top: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header style="background: var(--pea-purple); color: white; padding: 1rem; font-weight: 600;">
        <h1>PEA EMS — KOH TAO</h1>
    </header>
    <main class="dashboard-grid">
        <aside class="panel col-left">
            <h3>Source Status</h3>
            <div class="source-meter">
                <label>Grid Import</label>
                <div class="meter-bar"><div class="fill" style="width: 45%; background: var(--color-grid);"></div></div>
                <div class="value mono">4.50 <span style="font-size: 0.8rem; font-weight: 400;">MW</span></div>
            </div>
            <div class="source-meter">
                <label>Diesel Generation</label>
                <div class="meter-bar"><div class="fill" style="width: 30%; background: var(--color-diesel);"></div></div>
                <div class="value mono">3.00 <span style="font-size: 0.8rem; font-weight: 400;">MW</span></div>
            </div>
            <div class="source-meter">
                <label>BESS Contribution</label>
                <div class="meter-bar"><div class="fill" style="width: 20%; background: var(--color-bess);"></div></div>
                <div class="value mono">2.00 <span style="font-size: 0.8rem; font-weight: 400;">MW</span></div>
            </div>

            <div class="soc-gauge-container">
                <label class="soc-label">BESS State of Charge</label>
                <div class="soc-gauge" style="--soc-p: 85%;">
                    <div class="limit-marker limit-min" title="Min Safety Limit (20%)"></div>
                    <div class="limit-marker limit-max" title="Max Safety Limit (90%)"></div>
                    <span class="mono">85%</span>
                </div>
                <div class="limit-labels mono">
                    <span>MIN 20%</span>
                    <span>MAX 90%</span>
                </div>
            </div>
        </aside>
        <section class="panel col-mid">Middle: Dispatch & Chart</section>
        <aside class="panel col-right">Right: Alerts & Economy</aside>
    </main>
</body>
</html>
